repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/data/  # expected outputs, must stay byte-exact
      - id: end-of-file-fixer
        exclude: ^(AGENTS\.md|tests/data/.*)$  # AGENTS.md: symlink, a plain file when core.symlinks=false; tests/data: byte-exact
      - id: check-yaml
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies: [pytest, pytest-mock]
  - repo: local
    hooks:
      # architecture contracts from pyproject.toml [tool.importlinter]
      - id: import-linter
        name: import-linter
        entry: lint-imports
        language: python
        additional_dependencies: [import-linter==2.15]
        pass_filenames: false
        files: ^(hangman/.*\.py|pyproject\.toml)$
      # project rules in ast-grep/rules (sgconfig.yml), with their own tests
      - id: ast-grep
        name: ast-grep scan
        entry: ast-grep scan
        language: python
        additional_dependencies: [ast-grep-cli==0.51.1]
        pass_filenames: false
        files: ^(.*\.py|sgconfig\.yml|ast-grep/.*)$
      - id: ast-grep-test
        name: ast-grep rule tests
        entry: ast-grep test --skip-snapshot-tests
        language: python
        additional_dependencies: [ast-grep-cli==0.51.1]
        pass_filenames: false
        files: ^(sgconfig\.yml|ast-grep/.*)$
      # undeclared, unused and misplaced dependencies (config in pyproject.toml [tool.deptry])
      - id: deptry
        name: deptry
        entry: deptry .
        language: python
        additional_dependencies: [deptry==0.25.1]
        pass_filenames: false
        files: ^(.*\.py|pyproject\.toml)$
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.10.0
    hooks:
      # staged changes only; CI scans the whole git history (ci.yml, job "secrets")
      - id: betterleaks
  - repo: https://github.com/jdx/jactionlint
    rev: v2.5.0
    hooks:
      # GitHub Actions workflows and dependabot.yml
      - id: jactionlint-shellcheck  # bundles shellcheck for the run: scripts
  - repo: https://github.com/agent-sh/agnix
    rev: v0.61.0
    hooks:
      # CLAUDE.md / AGENTS.md; --strict: warnings fail too (they exit 0 otherwise)
      - id: agnix
        args: [--strict]
