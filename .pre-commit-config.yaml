repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/data/  # expected outputs, must stay byte-exact
      - id: end-of-file-fixer
        exclude: ^(AGENTS\.md|tests/data/.*)$  # AGENTS.md: symlink, a plain file when core.symlinks=false; tests/data: byte-exact
      - id: check-yaml
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies: [jinja2, pytest, pytest-mock]
