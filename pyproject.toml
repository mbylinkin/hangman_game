[project]
name = "hangman-game"
version = "0.1.0"
description = "Console Hangman game"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

# development tooling, not part of the package (PEP 735); installed by `uv sync`, pinned in uv.lock
[dependency-groups]
dev = [
    "pre-commit>=3.6",
    "pytest>=8",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "pytest-sugar>=1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
hangman = "hangman.cli:main"

[tool.setuptools]
packages = ["hangman"]

[tool.setuptools.package-data]
hangman = ["data/*.txt"]

# Architecture contracts (lint-imports), see CLAUDE.md "Architecture"
[tool.importlinter]
root_package = "hangman"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "MVC layers: higher layers may import lower ones, never the reverse"
type = "layers"
layers = [
    "hangman.cli",
    "hangman.gui",
    "hangman.main",
    "hangman.controller",
    "hangman.view",
    "hangman.model",
    "hangman.input | hangman.templates",
    "hangman.const",
]

[[tool.importlinter.contracts]]
name = "tkinter is imported only in hangman.gui (the console path stays tkinter-free)"
type = "forbidden"
source_modules = [
    "hangman.__main__",
    "hangman.cli",
    "hangman.main",
    "hangman.controller",
    "hangman.view",
    "hangman.model",
    "hangman.input",
    "hangman.templates",
    "hangman.const",
]
forbidden_modules = ["tkinter"]
allow_indirect_imports = true
