[project]
name = "hangman-game"
version = "0.1.0"
description = "Console Hangman game"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6",
    "pytest>=8",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "pytest-sugar>=1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
hangman = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["data/*.txt"]
